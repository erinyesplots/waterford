<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Waterford Property Map</title>

  <link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
        }

        #map {
            height: 100vh;
            width: 100%;
        }
        .priceLabel {
    background: transparent;
    border: none;
    box-shadow: none;
    color: #666666;
    font-size: 8px;
    font-weight: bold;
    pointer-events: none;
}
.priceLabel:before {
    display: none;
}
    .legend {
    background: white;
    padding: 8px 10px;
    line-height: 18px;
    color: #333;
    border-radius: 5px;
    box-shadow: 0 0 15px rgba(0,0,0,0.2);
    font-size: 12px;
}

.legend i {
    width: 10px;
    height: 10px;
    float: left;
    margin-right: 6px;
    margin-top: 4px;
    border-radius: 50%;
}   
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([52.15, -7.15], 10);

const osm = L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
);

const imagery = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles © Esri'
    }
);

osm.addTo(map);

// Create empty layer groups

const labelsLayer = L.layerGroup().addTo(map);
const pricesLayer = L.layerGroup().addTo(map);
const riversLayer = L.layerGroup().addTo(map);
const woodsLayer = L.layerGroup().addTo(map);
const tenLayer = L.layerGroup().addTo(map);
const twentyLayer = L.layerGroup().addTo(map);
const thirtyLayer = L.layerGroup().addTo(map);

// Layer control

L.control.layers(
{
    "OpenStreetMap": osm,
    "Aerial Imagery": imagery
},
{
    "Property Prices": pricesLayer,
    "Price Labels": labelsLayer,
    "Rivers": riversLayer,
    "Broadleaved Woodlands": woodsLayer,
    "10 Minute Drive Time": tenLayer,
    "20 Minute Drive Time": twentyLayer,
    "30 Minute Drive Time": thirtyLayer
},
{
    collapsed: false
}
).addTo(map);

// Sold 2024-2026

fetch('data/PropertyPriceRegister.geojson')
    .then(response => response.json())
    .then(data => {

        const prices = L.geoJSON(data, {

            pointToLayer: function(feature, latlng) {

                let colour = '#7b2cbf';

                if (feature.properties.PriceType === 'Under Full Market') {
                    colour = '#cbc3e3';
                }

                return L.circleMarker(latlng, {
                    radius: 3,
                    fillColor: colour,
                    color: '#472C4C',
                    weight: 1,
                    fillOpacity: 0.9
                });

            },

            onEachFeature: function(feature, layer) {

                const p = feature.properties;

                layer.bindPopup(
                    "<b>Price:</b> €" + p.Price.toLocaleString() +
                    "<br><b>Price Type:</b> " + p.PriceType +
                    "<br><b>Address:</b> " + p.Address +
                    "<br><b>Eircode:</b> " + p.Eircode
                );

            }

        });

      prices.addTo(pricesLayer);

data.features.forEach(function(feature) {

    const coords = feature.geometry.coordinates;

    const labelMarker = L.marker(
        [coords[1], coords[0]],
        {
            opacity: 0,
            interactive: false
        }
    );

    labelMarker.bindTooltip(
        feature.properties.PriceinK.toString(),
        {
            permanent: true,
            direction: 'bottom',
            offset: [2, 2],
            className: 'priceLabel'
        }
    );

    labelMarker.addTo(labelsLayer);

});

map.fitBounds(prices.getBounds());

    });

// Rivers

fetch('data/rivers.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#00C8FF',
                weight: 0.5
            }
        }).addTo(riversLayer);

    });

// Woods

fetch('data/woods.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#006400',
                fillColor: '#228B22',
                fillOpacity: 0.4,
                weight: 1
            }
        }).addTo(woodsLayer);

    });

// 30 minutes

fetch('data/thirty.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#8B2E2E',
                fillOpacity: 0,
                weight: 2
            }
        }).addTo(thirtyLayer);

    });

// 20 minutes

fetch('data/twenty.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#C9A227',
                fillOpacity: 0,
                weight: 2
            }
        }).addTo(twentyLayer);

    });

// 10 minutes

fetch('data/ten.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#3A7D44',
                fillOpacity: 0,
                weight: 2
            }
        }).addTo(tenLayer);

    });
    const legend = L.control({position: 'bottomright'});

legend.onAdd = function () {

    const div = L.DomUtil.create('div', 'legend');

    div.innerHTML =
        '<b>Property Prices</b><br>' +
        '<i style="background:#7b2cbf"></i> Market Price<br>' +
        '<i style="background:#cbc3e3"></i> Under Full Market';

    return div;
};

legend.addTo(map);
</script>

</body>
</html>
