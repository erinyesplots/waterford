<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Waterford Property Map</title>

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
        }

        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([52.15, -7.15], 10);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

fetch('data/PropertyPriceRegister.geojson')
    .then(response => response.json())
    .then(data => {

        const prices = L.geoJSON(data, {

            pointToLayer: function(feature, latlng) {

                return L.circleMarker(latlng, {
                    radius: 5,
                    fillColor: '#ff6600',
                    color: '#ffffff',
                    weight: 1,
                    fillOpacity: 0.8
                });

            },

            onEachFeature: function(feature, layer) {

                const p = feature.properties;

                layer.bindPopup(
                    "<b>Price:</b> €" + p.Price.toLocaleString() +
                    "<br><b>Address:</b> " + p.Address +
                    "<br><b>Eircode:</b> " + p.Eircode
                );

            }

        });

        prices.addTo(map);

        map.fitBounds(prices.getBounds());

    });
fetch('data/rivers.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#0080ff',
                weight: 2
            }
        }).addTo(map);

    });
fetch('data/woods.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#006400',
                fillColor: '#228B22',
                fillOpacity: 0.4,
                weight: 1
            }
        }).addTo(map);

    });
  fetch('data/thirty.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#006837',
                fillColor: '#006837',
                fillOpacity: 0.15,
                weight: 2
            }
        }).addTo(map);

    });  

fetch('data/twenty.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#31a354',
                fillColor: '#31a354',
                fillOpacity: 0.20,
                weight: 2
            }
        }).addTo(map);

    });

    fetch('data/ten.geojson')
    .then(response => response.json())
    .then(data => {

        L.geoJSON(data, {
            style: {
                color: '#78c679',
                fillColor: '#78c679',
                fillOpacity: 0.25,
                weight: 2
            }
        }).addTo(map);

    });
    
</script>

</body>
</html>
