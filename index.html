<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Waterford Property Map</title>

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
        }

        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([52.15, -7.15], 10);

let pricesLayer;
let riversLayer;
let woodsLayer;
let tenLayer;
let twentyLayer;
let thirtyLayer;

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

fetch('data/PropertyPriceRegister.geojson')
    .then(response => response.json())
    .then(data => {

        pricesLayer = L.geoJSON(data, {

            pointToLayer: function(feature, latlng) {

                let colour = '#7b2cbf';

                if (feature.properties.PriceType === 'Under Full Market') {
                    colour = '#C2185B';
                }

                return L.circleMarker(latlng, {
                    radius: 3,
                    fillColor: colour,
                    color: '#472C4C',
                    weight: 1,
                    fillOpacity: 0.9
                });

            },

            onEachFeature: function(feature, layer) {

                const p = feature.properties;

                layer.bindPopup(
                    "<b>Price:</b> €" + p.Price.toLocaleString() +
                    "<br><b>Price Type:</b> " + p.PriceType +
                    "<br><b>Address:</b> " + p.Address +
                    "<br><b>Eircode:</b> " + p.Eircode
                );

            }

        });

        pricesLayer.addTo(map);

        map.fitBounds(pricesLayer.getBounds());

    });

fetch('data/rivers.geojson')
    .then(response => response.json())
    .then(data => {

        riversLayer = L.geoJSON(data, {
            style: {
                color: '#00C8FF',
                weight: 0.5
            }
        });

        riversLayer.addTo(map);

    });
