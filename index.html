<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Waterford Property Map</title>

    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
        }

        #map {
            height: 100vh;
            width: 100%;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([52.15, -7.15], 10);

let pricesLayer;
let riversLayer;
let woodsLayer;
let tenLayer;
let twentyLayer;
let thirtyLayer;
    
L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap contributors'
    }
).addTo(map);

fetch('data/PropertyPriceRegister.geojson')
    .then(response => response.json())
    .then(data => {

     pricesLayer = L.geoJSON(data, {

            pointToLayer: function(feature, latlng) {

                let colour = '#7b2cbf';

                if (feature.properties.PriceType === 'Under Full Market') {
                    colour = '#C2185B';
                }

                return L.circleMarker(latlng, {
                    radius: 3,
                    fillColor: colour,
                    color: '#472C4C',
                    weight: 1,
                    fillOpacity: 0.9
                });

            },

            onEachFeature: function(feature, layer) {

                const p = feature.properties;

                layer.bindPopup(
                    "<b>Price:</b> €" + p.Price.toLocaleString() +
                    "<br><b>Price Type:</b> " + p.PriceType +
                    "<br><b>Address:</b> " + p.Address +
                    "<br><b>Eircode:</b> " + p.Eircode
                );

            }

        });

      pricesLayer.addTo(map);

map.fitBounds(pricesLayer.getBounds());

    });

fetch('data/rivers.geojson')
    .then(response => response.json())
    .then(data => {

       riversLayer = L.geoJSON(data, {
           style: {
                color: '#00C8FF',
                weight: 0.5
            }
     });

riversLayer.addTo(map);

    });

fetch('data/woods.geojson')
    .then(response => response.json())
    .then(data => {

       woodsLayer = L.geoJSON(data, {
            style: {
                color: '#006400',
                fillColor: '#228B22',
                fillOpacity: 0.4,
                weight: 1
            }
     woodsLayer.addTo(map);

    });

fetch('data/twenty.geojson')
    .then(response => response.json())
    .then(data => {

     twentyLayer = L.geoJSON(data, {
            style: {
                color: '#C9A227',
                fillOpacity: 0,
                weight: 2
            }
      twentyLayer.addTo(map);

    });
fetch('data/thirty.geojson')
    .then(response => response.json())
    .then(data => {

     thirtyLayer = L.geoJSON(data, {
            style: {
                color: '#8B2E2E',
                fillOpacity: 0,
                weight: 2
            }
      thirtyLayer.addTo(map);

    });


fetch('data/ten.geojson')
    .then(response => response.json())
    .then(data => {

    tenLayer = L.geoJSON(data, {
            style: {
                color: '#3A7D44',
                fillOpacity: 0,
                weight: 2
            }
    tenLayer.addTo(map);

    });

setTimeout(function () {

    const overlayMaps = {
        "Property Prices": pricesLayer,
        "Rivers": riversLayer,
        "Woodlands": woodsLayer,
        "10 Minute Drive Time": tenLayer,
        "20 Minute Drive Time": twentyLayer,
        "30 Minute Drive Time": thirtyLayer
    };

    L.control.layers(null, overlayMaps, {
        collapsed: false
    }).addTo(map);

}, 1000);
        
</script>

</body>
</html>
